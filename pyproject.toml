[project]
name = "crop-seg"
version = "0.1.0"
description = "Crop segmentation competition (rice/wheat/rape) - local training & inference"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.24",
    "pillow>=10",
    "tqdm",
    "scipy",
    "scikit-learn",
    "albumentations>=1.3",
    "opencv-python-headless",
    "segmentation-models-pytorch>=0.3.3",
    "timm>=0.9",
    "matplotlib",
    "pandas",
]

[tool.uv]
index-url = "https://pypi.org/simple"
cache-dir = ".uv-cache"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
